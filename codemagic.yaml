workflows:
  android-workflow:
    name: Gaylerii Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Extract project
        script: unzip Gaylerii.zip
      - name: Build APK
        script: |
          cd Gaylerii
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug
    artifacts:
      - Gaylerii/app/build/outputs/apk/debug/app-debug.apk
