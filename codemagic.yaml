workflows:
  android-workflow:
    name: Gaylerii Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Extract project
        script: unzip Gaylerii.zip

      - name: Fix font issue
        script: |
          find Gaylerii/app/src/main/res -name "*.xml" -exec sed -i 's/android:fontFamily="@font\/nunito_bold"//g' {} \;
          echo '<?xml version="1.0" encoding="utf-8"?><font-family xmlns:android="http://schemas.android.com/apk/res/android"></font-family>' > Gaylerii/app/src/main/res/font/nunito_bold.xml

      - name: Fix albumSection reference
        script: |
          sed -i 's/private lateinit var albumSection: View/private lateinit var albumSection: androidx.recyclerview.widget.RecyclerView/' Gaylerii/app/src/main/java/com/gaylerii/MainActivity.kt
          sed -i 's/albumSection = findViewById(R.id.albumSection)/albumSection = findViewById(R.id.rvAlbums)/' Gaylerii/app/src/main/java/com/gaylerii/MainActivity.kt

      - name: Build APK
        script: |
          cd Gaylerii
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug

    artifacts:
      - Gaylerii/app/build/outputs/apk/debug/app-debug.apk
